<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문학과 삶에서 만나는 의미 - 국어 학습 도우미 및 형성 평가</title>
  <!-- Tailwind CSS 및 FontAwesome 아이콘, 라이브러리 탑재 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght=400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 한지 느낌의 은은한 아날로그 문학 감성 배경판 */
    .traditional-paper {
      background-image: radial-gradient(#faf6ee 1px, transparent 0), radial-gradient(#faf6ee 1px, transparent 0);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
      background-color: #fefcf8;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-gray-50 to-indigo-50/30 text-gray-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">

        <i class="fa-solid fa-book-open text-3xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-indigo-800 tracking-tight">핵심 콕콕! 문학과 삶에서 만나는 의미</h1>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>

            id="input-grade"
            placeholder="예) 1"
            min="1"
            max="6"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-gray-50/50"
          />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">반</label>
          <input 
            type="number" 
            id="input-class"
            placeholder="예) 3"
            min="1"
            max="30"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-gray-50/50"
          />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">번호</label>
          <input 
            type="number" 
            id="input-number"
            placeholder="예) 15"
            min="1"
            max="50"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-gray-50/50"
          />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">이름</label>
          <input 
            type="text" 
            id="input-name"
            placeholder="예) 김성경"

        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>인적사항이 비워져 있으면 '형성 평가' 답안 제출 및 스프레드시트 기록 전송을 하실 수 없습니다.</span>

    </div>

      <!-- JavaScript에서 동적으로 서브 탭이 렌더링됩니다. -->
    </div>

      <div class="flex items-center gap-3.5 mb-6 border-b border-gray-100 pb-4">

        </div>

    </div>

  </div>

    let activeSubTab = "뜻";
    let selectedAnswers = {};
    let quizSubmitted = false;
    let googleWebUrl = "";

    // 초기화 및 이벤트 리스너 바인딩
    window.onload = function() {
      // 인적사항 입력 상태 감시자 바인딩
      const inputs = ["input-grade", "input-class", "input-number", "input-name"];
      inputs.forEach(id => {
        document.getElementById(id).addEventListener('input', updateInfoStatus);
      });
      
      renderMainTabs();
      renderSubTabs();
      renderContent();
    };

    // 인적 사항 기입 피드백 감시 처리
    function updateInfoStatus() {
      const grade = document.getElementById("input-grade").value;
      const classNum = document.getElementById("input-class").value;
      const studentNum = document.getElementById("input-number").value;
      const name = document.getElementById("input-name").value;
      const statusBox = document.getElementById("info-status-box");

      if (grade && classNum && studentNum && name) {
        statusBox.className = "mt-3 text-xs text-green-600 font-semibold flex items-center gap-1.5 bg-green-50/50 p-2 rounded-xl border border-green-100";
        statusBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>확인됨: ${grade}학년 ${classNum}반 ${studentNum}번 ${name} 학생용 답안지가 준비되었습니다.</span>`;
      } else {
        statusBox.className = "mt-3 text-xs text-red-500 font-medium flex items-center gap-1.5";
        statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>인적사항이 비워져 있으면 '형성 평가' 답안 제출 및 스프레드시트 기록 전송을 하실 수 없습니다.</span>`;
      }
    }

    // 대주제 탭 버튼 렌더링
    function renderMainTabs() {
      const container = document.getElementById("main-tabs-container");
      container.innerHTML = "";
      
      Object.keys(learningData).forEach(tabName => {
        const tabData = learningData[tabName];
        const isActive = activeMainTab === tabName;
        
        const button = document.createElement("button");
        button.className = `flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl font-bold transition-all duration-300 ${
          isActive
            ? "bg-indigo-600 text-white shadow-lg shadow-indigo-200 transform scale-[1.02]"
            : "bg-gray-50 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600"
        }`;
        
        button.innerHTML = `
          <i class="fa-solid ${tabData.icon}"></i>
          <span class="text-sm md:text-base">${tabName}</span>
        `;
        
        button.onclick = () => {
          activeMainTab = tabName;
          activeSubTab = Object.keys(learningData[tabName].subTabs)[0]; // 첫 서브탭으로 기본값 셋팅
          resetQuizState();
          renderMainTabs();
          renderSubTabs();
          renderContent();
        };
        
        container.appendChild(button);
      });
    }

    // 세부 영역 선택 탭 (서브 버튼) 렌더링
    function renderSubTabs() {
      const container = document.getElementById("sub-tabs-container");
      container.innerHTML = "";
      
      const subTabs = learningData[activeMainTab].subTabs;
      
      Object.keys(subTabs).forEach(subTabName => {
        const isQuizTab = subTabName === "형성 평가";
        const isActive = activeSubTab === subTabName;
        
        let buttonClass = `px-5 py-2.5 rounded-full text-xs md:text-sm font-semibold transition-all duration-200 border `;
        if (isActive) {
          buttonClass += isQuizTab 
            ? "bg-amber-100 text-amber-800 border-amber-300 shadow-sm"
            : "bg-indigo-100 text-indigo-800 border-indigo-300 shadow-sm";
        } else {
          buttonClass += isQuizTab
            ? "bg-amber-50/50 text-amber-700 border-amber-100 hover:bg-amber-100/40"
            : "bg-white text-gray-500 border-gray-200 hover:bg-gray-100";
        }
        
        const button = document.createElement("button");
        button.className = buttonClass;
        button.innerText = subTabName;
        button.onclick = () => {
          activeSubTab = subTabName;
          resetQuizState();
          renderSubTabs();
          renderContent();
        };
        
        container.appendChild(button);
      });
    }

    // 선택 누적 퀴즈 상태 청소기
    function resetQuizState() {
      selectedAnswers = {};
      quizSubmitted = false;
      document.getElementById("warning-banner").classList.add("hidden");
    }

    // 주 학습 콘텐츠 화면 및 평가 시험지 렌더링
    function renderContent() {
      const subTabs = learningData[activeMainTab].subTabs;
      const currentContent = subTabs[activeSubTab] || subTabs[Object.keys(subTabs)[0]];

      // 헤더 및 안내 업데이트
      document.getElementById("content-category-path").innerText = `${activeMainTab} ㆍ ${activeSubTab}`;
      document.getElementById("content-title").innerText = currentContent.title;
      document.getElementById("content-brief").innerHTML = currentContent.content; // HTML 강조 서식 허용
      
      // 아이콘 업데이트
      const iconContainer = document.getElementById("content-icon-container");
      const iconElement = document.getElementById("content-icon");
      iconElement.className = `fa-solid ${currentContent.icon}`;
      
      if (activeSubTab === "형성 평가") {
        iconContainer.className = "p-3 rounded-xl bg-amber-100 text-amber-600";
        document.getElementById("content-brief").className = "text-base md:text-lg text-gray-700 mb-8 p-4 rounded-xl leading-relaxed border border-amber-100 bg-amber-50/20";
      } else {
        iconContainer.className = "p-3 rounded-xl bg-indigo-50 text-indigo-600";
        document.getElementById("content-brief").className = "text-base md:text-lg text-gray-700 mb-8 p-4 rounded-xl leading-relaxed border border-indigo-100 bg-indigo-50/40";
      }

      const detailsArea = document.getElementById("content-details-area");
      detailsArea.innerHTML = "";

      if (currentContent.isQuiz) {
        // 형성평가 시험지 인터페이스 렌더링
        renderQuizSheet(currentContent, detailsArea);
      } else if (currentContent.isInteractive) {
        // "전문 해설" 인터랙티브 패널 렌더링
        renderInteractivePoem(currentContent, detailsArea);
      } else {
        // 일반 개념 카드형 리스트 렌더링
        renderConceptList(currentContent, detailsArea);
      }
    }

    // 전문 입체 해설 렌더링 함수
    function renderInteractivePoem(content, container) {
      const wrapper = document.createElement("div");
      wrapper.className = "grid grid-cols-1 md:grid-cols-12 gap-6 fade-in";

      // 왼쪽: 시 전문 낭독판 카드
      const leftCol = document.createElement("div");
      leftCol.className = "md:col-span-6 p-6 rounded-2xl border border-amber-100/60 traditional-paper flex flex-col justify-center text-center shadow-sm relative";
      
      const pHeader = document.createElement("div");
      pHeader.className = "mb-4 pb-3 border-b border-amber-100/80 text-amber-950";
      pHeader.innerHTML = `
        <h3 class="font-bold text-lg text-indigo-900">${activeMainTab}</h3>
        <p class="text-xs text-amber-800/80 mt-1">${content.author || "작가 미상"}</p>
      `;
      leftCol.appendChild(pHeader);

      const poemBody = document.createElement("div");
      poemBody.className = "space-y-4 py-2";

      // 오른쪽: 구절별 입체 해설 카드 미리 선언
      const rightCol = document.createElement("div");
      rightCol.className = "md:col-span-6 p-6 rounded-2xl border border-indigo-100/50 bg-white/80 flex flex-col justify-between shadow-sm min-h-[300px]";

      const detailsBox = document.createElement("div");
      detailsBox.id = "interactive-commentary-panel";
      detailsBox.className = "space-y-4 transition-all duration-300 fade-in";
      
      // 우측 기본 상태 표출
      resetCommentaryPanel(detailsBox);
      rightCol.appendChild(detailsBox);

      // 구절들을 렌더링하며 각각에 마우스 오버 및 터치 반응 장착
      content.lines.forEach((line) => {
        const lineSpan = document.createElement("div");
        lineSpan.className = "group relative inline-block w-full py-3 px-4 rounded-xl border border-transparent hover:border-amber-200/50 hover:bg-amber-50/50 cursor-pointer transition-all duration-150 select-none text-left";
        
        // 연(Stanza) 또는 문단 라벨 기입하여 가로 구조 입체화
        lineSpan.innerHTML = `
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-[10px] font-black px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded border border-indigo-100 uppercase select-none">${line.stanza}</span>
          </div>
          <span class="text-gray-800 font-semibold text-sm md:text-base border-b-2 border-dotted border-amber-300/60 group-hover:border-amber-500 group-hover:text-amber-950 transition-colors duration-150 leading-relaxed block">
            ${line.text}
          </span>
        `;

        // 마우스 호버 및 터치 작동 바인딩
        const updateCommentary = () => {
          // 다른 모든 구절의 활성화 테두리 제거 후 타겟만 하이라이팅
          poemBody.querySelectorAll(".bg-amber-50").forEach(el => {
            el.classList.remove("bg-amber-50", "border-amber-200/50");
            el.classList.add("border-transparent");
          });
          lineSpan.classList.add("bg-amber-50", "border-amber-200/50");
          lineSpan.classList.remove("border-transparent");

          // 우측 패널의 해설 데이터 변경
          detailsBox.className = "space-y-4 opacity-0 scale-95 transition-all duration-150";
          setTimeout(() => {
            detailsBox.className = "space-y-4 opacity-100 scale-100 transition-all duration-150";
            
            // 이미지 관련 수식을 지운 순수 학술 가이드 팁 제작
            const isStarPoem = activeMainTab === "사랑하는 별 하나";
            const isNinePoem = activeMainTab === "열보다 큰 아홉";
            
            let dynamicNote = "";
            if (isStarPoem) {
              dynamicNote = `<p class="text-[10px] leading-normal text-amber-900 font-semibold mt-1">
                  💡 <strong>반복과 운율:</strong> 1ㆍ2연의 <strong>'~될 수 있을까'</strong>(의문형 구조)와 3ㆍ4연의 <strong>'~갖고 싶다'</strong>(소망형 구조)라는 특정 문장 및 표현 구조를 각 연별로 반복하여 대구적 리듬감(운율)을 형성하고, 세상을 밝히려는 화자의 이타적 염원을 깊이 있게 증폭함
                 </p>`;
            } else if (isNinePoem) {
              dynamicNote = `<p class="text-[10px] leading-normal text-amber-900 font-semibold mt-1">
                  💡 <strong>완벽과 성장의 대비:</strong> 수리적 대소 규칙인 10 > 9를 뛰어넘어, 완성된 존재인 어른(10)보다 끊임없이 배움과 자람이 일어나는 청소년 중학생(9)의 주관적 정성과 무한한 성장 가능성에 더 높은 가치를 부여하는 인문학적 교훈을 담아냄
                 </p>`;
            } else {
              dynamicNote = `<p class="text-[11px] leading-relaxed font-semibold text-amber-950">
                  이 대목은 <strong>봄날 대지의 수면, 정적인 물소리의 자장가, 극적인 아침 해빙, 새싹의 움틈</strong>으로 이어지는 변화를 담은 핵심 단락에 해당함
                 </p>`;
            }

            const coreTipHtml = `
              <div class="mt-4 p-3.5 bg-amber-50/70 border border-amber-200/60 rounded-xl text-left text-amber-950 space-y-1 fade-in">
                <span class="text-[11px] font-bold text-amber-800 flex items-center gap-1.5">
                  <i class="fa-solid fa-lightbulb"></i> 핵심 학습 요약 노트
                </span>
                ${dynamicNote}
              </div>
            `;

            // 설명창에 전문 수록 부분을 삭제하고 해설만 배치
            detailsBox.innerHTML = `
              <div class="pb-2 border-b border-gray-100 text-left">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] font-black px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded border border-indigo-100 select-none">${line.stanza} 해설</span>
                </div>
              </div>
              <div class="space-y-3 pt-1 text-left">
                <!-- 화자 분석 -->
                <div class="flex items-start gap-3">
                  <div class="flex-shrink-0 p-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-xs mt-0.5">
                    <i class="fa-solid fa-user"></i>
                  </div>
                  <div>
                    <span class="text-xs text-indigo-600 font-extrabold block">👤 화자의 상태 및 태도</span>
                    <p class="text-xs md:text-sm text-gray-700 font-semibold mt-0.5">${line.speaker}</p>
                  </div>
                </div>
                <!-- 비유와 상징 -->
                <div class="flex items-start gap-3">
                  <div class="flex-shrink-0 p-1.5 bg-amber-50 text-amber-600 rounded-lg text-xs mt-0.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                  </div>
                  <div>
                    <span class="text-xs text-amber-600 font-extrabold block">✨ 비유 및 상징적 의미</span>
                    <p class="text-xs md:text-sm text-gray-700 font-semibold mt-0.5">${line.symbol}</p>
                  </div>
                </div>
                <!-- 시상의 전개 -->
                <div class="flex items-start gap-3">
                  <div class="flex-shrink-0 p-1.5 bg-rose-50 text-rose-600 rounded-lg text-xs mt-0.5">
                    <i class="fa-solid fa-chart-line"></i>
                  </div>
                  <div>
                    <span class="text-xs text-rose-600 font-extrabold block">📈 시상 전개 및 내용 흐름</span>
                    <p class="text-xs md:text-sm text-gray-700 font-semibold mt-0.5">${line.flow}</p>
                  </div>
                </div>
                ${coreTipHtml}
              </div>
            `;
          }, 150);
        };

        lineSpan.addEventListener("mouseenter", updateCommentary);
        lineSpan.addEventListener("click", updateCommentary);

        poemBody.appendChild(lineSpan);
      });

      leftCol.appendChild(poemBody);

      // 하단 터치 가이드문 추가
      const pFooter = document.createElement("div");
      pFooter.className = "mt-4 text-[10px] text-amber-800/60 leading-relaxed";
      pFooter.innerHTML = `* 각 문단 및 연 단위로 정렬된 구절 위에 마우스를 올리거나 모바일에서 직접 클릭하시면 실시간으로 우측 입체 스마트 분석판이 자동으로 갱신됨`;
      leftCol.appendChild(pFooter);

      wrapper.appendChild(leftCol);
      wrapper.appendChild(rightCol);
      container.appendChild(wrapper);
    }

    // 우측 해설판 기본 안내 상태 셋팅
    function resetCommentaryPanel(panel) {
      panel.innerHTML = `
        <div class="flex flex-col items-center justify-center text-center py-12 space-y-4">
          <!-- 골드 그라데이션 불꽃 묘사 -->
          <svg class="w-12 h-12 animate-pulse" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L14 8 L20 10 L14 12 L12 18 L10 12 L4 10 L10 8 Z" fill="url(#panel-sparkle-grad)"/>
            <defs>
              <linearGradient id="panel-sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fbbf24" />
                <stop offset="100%" stop-color="#f97316" />
              </linearGradient>
            </defs>
          </svg>
          <div class="space-y-1.5">
            <h4 class="font-extrabold text-sm md:text-base text-gray-800">구절별 입체 스마트 해설판</h4>
            <p class="text-xs text-gray-500 max-w-[250px] leading-relaxed mx-auto">
              왼쪽의 문학 낭독판에서 연별 구절 위에 마우스를 대거나 직접 클릭하시면 화자의 태도, 비유/상징, 시상의 전개 정보가 실시간 반영됨
            </p>
          </div>
        </div>
      `;
    }

    // 일반 개념 정리 상세 카드 그리기 (파란색 세로줄 완전 배제 및 내어쓰기 칼정렬 보존)
    function renderConceptList(content, container) {
      content.details.forEach(detail => {
        // 소제목 📌 헤더 영역 감지 및 렌더링 최적화
        if (detail.startsWith("📌")) {
          const header = document.createElement("div");
          header.className = "fade-in font-extrabold text-indigo-900 text-base md:text-lg border-b border-indigo-100 pb-1.5 pt-4 mb-2 mt-4 text-left flex items-center gap-2";
          header.innerHTML = `<i class="fa-solid fa-folder-open text-indigo-600"></i> <span>${detail.substring(2)}</span>`;
          container.appendChild(header);
          return;
        }

        const card = document.createElement("div");
        
        // 1. 운율에 명시된 특정 예외 구절들 검출 조건 (정형시 예외)
        const isExemptedRythm = detail.startsWith("[대표 예시]") || 
                                detail.startsWith("초장:") || 
                                detail.startsWith("중장:") || 
                                detail.startsWith("종장:");
                                
        // 2. 심상에 명시된 공감각적 심상 예외 구절들 검출 조건 (예시 문단)
        const isExemptedImagery = detail.startsWith("✨ [청") || 
                                  detail.startsWith("✨ [시");

        // 3. 종류 분류 탭 내의 '서정시', '서사시', '자유시', '정형시', '산문시' 검출 조건
        const isExemptedColons = detail.startsWith("  서정시(") || 
                                 detail.startsWith("  서사시(") || 
                                 detail.startsWith("  정형시(") || 
                                 detail.startsWith("  자유시(") || 
                                 detail.startsWith("  산문시(");
        
        // 4. 비유 탭 내의 예시 구절 및 지시자 검출 조건
        const isExemptedMetaphor = detail.startsWith("직유법:") ||
                                   detail.startsWith("은유법:") ||
                                   detail.startsWith("의인법:") ||
                                   detail.startsWith("🔍 예시:") ||
                                   detail.startsWith("👉 원관념");
        
        if (isExemptedRythm) {
          // 초장, 중장, 종장 등 시조 예시는 안쪽으로 들여쓰기 정렬하며 파란색 세로줄 없음
          card.className = "fade-in flex gap-3 bg-gray-50/80 p-4 rounded-xl border border-gray-100 hover:border-indigo-100/70 transition-all duration-200 shadow-sm hover:shadow-md pl-10 md:pl-12 text-left";
          
          const textContainer = document.createElement("p");
          textContainer.className = "text-gray-700 leading-relaxed text-sm md:text-base w-full";
          
          const colonIndex = detail.indexOf(':');
          if (colonIndex !== -1) {
            const keyword = detail.substring(0, colonIndex + 1);
            const description = detail.substring(colonIndex + 1);
            textContainer.innerHTML = `<strong class="text-indigo-950 font-bold bg-indigo-50/70 px-1.5 py-0.5 rounded mr-1">${keyword}</strong>${description}`;
          } else {
            textContainer.innerText = detail;
          }
          card.appendChild(textContainer);
          
        } else if (isExemptedColons) {
          // 세로 시작점을 부모 타이틀의 첫 글자와 일치시킴 (파란 세로줄 일체 없음)
          card.className = "fade-in flex bg-gray-50/80 p-4 rounded-xl border border-gray-100 hover:border-indigo-100/70 transition-all duration-200 shadow-sm hover:shadow-md ml-6 md:ml-8 text-left";
          
          const cleanDetail = detail.trim();
          const colonIndex = cleanDetail.indexOf(':');
          
          if (colonIndex !== -1) {
            const keyword = cleanDetail.substring(0, colonIndex + 1); // "서정시(抒情詩):"
            const description = cleanDetail.substring(colonIndex + 1); // " 개인의 주관적인..."
            
            // 텍스트 정렬을 위해 Flexbox와 고정 레이아웃 가미하여 완벽한 내어쓰기 보존
            card.innerHTML = `
              <div class="flex flex-col sm:flex-row items-start w-full gap-2 sm:gap-0">
                <span class="flex-shrink-0 w-full sm:w-36 text-indigo-950 font-black bg-indigo-50/70 px-2 py-0.5 rounded select-none text-sm md:text-base">${keyword}</span>
                <span class="flex-1 text-gray-700 leading-relaxed text-sm md:text-base pl-1 sm:pl-2 border-l-0 sm:border-l-2 border-indigo-100">${description}</span>
              </div>
            `;
          } else {
            const textContainer = document.createElement("p");
            textContainer.className = "text-gray-700 leading-relaxed text-sm md:text-base w-full";
            textContainer.innerText = cleanDetail;
            card.appendChild(textContainer);
          }

        } else if (isExemptedImagery) {
          // 공감각적 예시 정렬 (Hanging Indent) 적용 카드
          card.className = "fade-in flex bg-gray-50/80 p-4 rounded-xl border border-gray-100 hover:border-indigo-100/70 transition-all duration-200 shadow-sm hover:shadow-md ml-6 md:ml-8 text-left";
          
          const bracketIndex = detail.indexOf('[');
          const leftPart = detail.substring(0, bracketIndex); // "✨ "
          const rightPart = detail.substring(bracketIndex); // "[청각의 시각화] 예시 1: ..."
          
          const closingBracketIndex = rightPart.indexOf(']');
          const tagPart = rightPart.substring(0, closingBracketIndex + 1); // "[청각의 시각화]"
          const descPart = rightPart.substring(closingBracketIndex + 1); // " 예시 1: ..."
          
          card.innerHTML = `
            <div class="flex items-start w-full">
              <!-- 왼쪽에는 이모지만 분리하여 배치하여 본문 전체 시작점이 '['의 시작과 완전히 일치하도록 정렬 -->
              <span class="flex-shrink-0 text-indigo-500 font-bold select-none mr-1">${leftPart}</span>
              <!-- 오른쪽은 '[' 문자로 완벽히 정렬되며 줄바꿈이 생겨도 두 번째 줄부터 완벽히 내어쓰기 처리 -->
              <span class="flex-1 text-gray-700 leading-relaxed text-sm md:text-base" style="padding-left: 1.15rem; text-indent: -1.15rem;">
                <strong class="text-indigo-950 font-bold bg-indigo-50/70 px-1 py-0.5 rounded mr-1">${tagPart}</strong>${descPart}
              </span>
            </div>
          `;
        } else if (isExemptedMetaphor) {
          // 비유 탭 전용으로 가로 폭을 정밀하게 좁힌 카드형 레이아웃 구현 (용어 설명과의 입체감 부여)
          let cardClass = "fade-in flex bg-gray-50/80 p-4 rounded-xl border border-gray-100 hover:border-indigo-100/70 transition-all duration-200 shadow-sm hover:shadow-md text-left ";
          
          if (detail.startsWith("직유법:") || detail.startsWith("은유법:") || detail.startsWith("의인법:")) {
            cardClass += "pl-6 font-bold";
            card.className = cardClass;
            const textContainer = document.createElement("p");
            textContainer.className = "text-indigo-900 leading-relaxed text-base md:text-lg w-full";
            const colonIdx = detail.indexOf(':');
            textContainer.innerHTML = `<span class="bg-indigo-100/80 text-indigo-800 font-extrabold px-3 py-1 rounded-lg mr-2">${detail.substring(0, colonIdx)}</span> ${detail.substring(colonIdx + 1)}`;
            card.appendChild(textContainer);
          } else if (detail.startsWith("🔍 예시:")) {
            cardClass += "w-11/12 ml-auto bg-white/60 border-l-0";
            card.className = cardClass;
            const textContainer = document.createElement("p");
            textContainer.className = "text-gray-800 leading-relaxed text-sm md:text-base w-full italic font-medium";
            textContainer.innerHTML = detail;
            card.appendChild(textContainer);
          } else if (detail.startsWith("👉 원관념")) {
            cardClass += "w-11/12 ml-auto bg-indigo-50/20 border-l-0";
            card.className = cardClass;
            const textContainer = document.createElement("p");
            textContainer.className = "text-indigo-955 font-semibold leading-relaxed text-xs md:text-sm w-full";
            textContainer.innerHTML = `<i class="fa-solid fa-arrow-right-long text-indigo-500 mr-1.5"></i> ${detail.substring(2)}`;
            card.appendChild(textContainer);
          } else {
            card.className = cardClass + "pl-6";
            const textContainer = document.createElement("p");
            textContainer.className = "text-gray-700 text-sm md:text-base w-full";
            textContainer.innerHTML = detail;
            card.appendChild(textContainer);
          }
        } else {
          // 일반 설명란 카드 그리기 (골드 그라데이션 불꽃 적용 및 파란 세로줄 배제)
          const cleanDetail = detail.trim();
          const colonIndex = cleanDetail.indexOf(':');

          if (colonIndex !== -1 && detail.startsWith("  ")) {
            // 들여쓰기된 항목이면서 콜론으로 용어 설명이 분류된 구조 ➔ 완벽한 내어쓰기(Hanging Indent) 구현
            card.className = "fade-in flex gap-3 bg-gray-50/80 p-4 rounded-xl border border-gray-100 hover:border-indigo-100/70 transition-all duration-200 shadow-sm hover:shadow-md text-left ml-4 md:ml-6";
            
            // 골드 그라데이션 불꽃 아이콘
            const iconSpan = document.createElement("span");
            iconSpan.className = "mt-1 flex-shrink-0";
            iconSpan.innerHTML = `
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                <path d="M12 2 L14 8 L20 10 L14 12 L12 18 L10 12 L4 10 L10 8 Z" fill="url(#bullet-sparkle-grad-com)"/>
                <defs>
                  <linearGradient id="bullet-sparkle-grad-com" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="100%" stop-color="#f97316" />
                  </linearGradient>
                </defs>
              </svg>
            `;
            card.appendChild(iconSpan);

            const keyword = cleanDetail.substring(0, colonIndex + 1);
            const description = cleanDetail.substring(colonIndex + 1);

            card.innerHTML += `
              <div class="flex flex-col sm:flex-row items-start w-full gap-1.5 sm:gap-0">
                <span class="flex-shrink-0 w-full sm:w-40 text-indigo-950 font-black bg-indigo-50/60 px-2 py-0.5 rounded select-none text-sm md:text-base">${keyword}</span>
                <span class="flex-1 text-gray-700 leading-relaxed text-sm md:text-base pl-1 sm:pl-2 border-l-0 sm:border-l-2 border-indigo-100">${description}</span>
              </div>
            `;
          } else {
            // 일반 플랫 설명 카드
            card.className = "fade-in flex gap-3 bg-gray-50/80 p-4 rounded-xl border border-gray-100 hover:border-indigo-100/70 transition-all duration-200 shadow-sm hover:shadow-md text-left";
            
            // 그라데이션 SVG 아이콘 삽입 (골드 불꽃 효과)
            const iconSpan = document.createElement("span");
            iconSpan.className = "mt-1 flex-shrink-0";
            iconSpan.innerHTML = `
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                <path d="M12 2 L14 8 L20 10 L14 12 L12 18 L10 12 L4 10 L10 8 Z" fill="url(#bullet-sparkle-grad-com-flat)"/>
                <defs>
                  <linearGradient id="bullet-sparkle-grad-com-flat" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="100%" stop-color="#f97316" />
                  </linearGradient>
                </defs>
              </svg>
            `;
            card.appendChild(iconSpan);

            const textContainer = document.createElement("p");
            textContainer.className = "text-gray-700 leading-relaxed text-sm md:text-base w-full";

            if (detail.startsWith("  ")) {
              textContainer.style.paddingLeft = "1.5rem";
            }

            if (colonIndex !== -1) {
              const keyword = detail.substring(0, colonIndex + 1);
              const description = detail.substring(colonIndex + 1);
              textContainer.innerHTML = `<strong class="text-indigo-950 font-bold bg-indigo-50/70 px-1.5 py-0.5 rounded mr-1">${keyword}</strong>${description}`;
            } else {
              textContainer.innerHTML = detail; // HTML 포맷 허용
            }
            card.appendChild(textContainer);
          }
        }
        
        container.appendChild(card);
      });
    }

    // 평가용 10문항 시험지와 채점지 그리기
    function renderQuizSheet(content, container) {
      content.questions.forEach((q, idx) => {
        const qBox = document.createElement("div");
        qBox.className = "fade-in p-5 md:p-6 bg-gray-50 rounded-2xl border border-gray-100 space-y-4";
        
        // 문항 발문 제목
        const qTitle = document.createElement("div");
        qTitle.className = "flex gap-2 text-left";
        qTitle.innerHTML = `<span class="font-bold text-lg text-indigo-600 flex-shrink-0">Q${idx + 1}.</span>
                            <h3 class="font-bold text-gray-800 text-base md:text-lg leading-relaxed">${q.question}</h3>`;
        qBox.appendChild(qTitle);

        // 보기 선택 옵션 그릇
        const optContainer = document.createElement("div");
        optContainer.className = "grid grid-cols-1 gap-2 pl-2";

        q.options.forEach((option, oIdx) => {
          const isSelected = selectedAnswers[q.id] === oIdx;
          const isCorrectAnswer = q.answer === oIdx;

          let btnClass = "flex items-center text-left w-full px-4 py-3 border rounded-xl text-sm transition-all ";
          
          if (quizSubmitted) {
            if (isSelected) {
              btnClass += isCorrectAnswer 
                ? "bg-green-100 border-green-400 text-green-800 font-semibold"
                : "bg-red-100 border-red-300 text-red-800";
            } else if (isCorrectAnswer) {
              btnClass += "bg-green-50 border-green-200 text-green-700 font-semibold";
            } else {
              btnClass += "bg-white border-gray-200 text-gray-400";
            }
          } else if (isSelected) {
            btnClass += "bg-indigo-50 border-indigo-400 text-indigo-800 font-semibold shadow-sm";
          } else {
            btnClass += "bg-white hover:bg-gray-100 border-gray-200 text-gray-700";
          }

          const optBtn = document.createElement("button");
          optBtn.className = btnClass;
          optBtn.disabled = quizSubmitted;
          optBtn.innerHTML = `<span class="w-6 h-6 mr-3 flex-shrink-0 flex items-center justify-center rounded-full border text-xs bg-gray-50 text-gray-500 font-bold">${oIdx + 1}</span>
                              <span>${option}</span>`;
          
          optBtn.onclick = () => {
            selectedAnswers[q.id] = oIdx;
            renderQuizSheet(content, container); // 화면 업데이트 갱신
          };

          optContainer.appendChild(optBtn);
        });
        qBox.appendChild(optContainer);

        // 결과 제출 후 해설 카드
        if (quizSubmitted) {
          const isCorrect = selectedAnswers[q.id] === q.answer;
          const expBox = document.createElement("div");
          expBox.className = `p-4 rounded-xl text-sm leading-relaxed text-left ${isCorrect ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`;
          expBox.innerHTML = `<div class="font-bold flex items-center gap-1.5 mb-1">
                                ${isCorrect ? "🎉 정답" : "❌ 오답"}
                                <span class="text-slate-500 font-normal"> (정답: ${q.answer + 1}번)</span>
                              </div>
                              <p class="mt-1 text-slate-600 font-medium"><strong class="text-slate-800">[해설]</strong> ${q.explanation}</p>`;
          qBox.appendChild(expBox);
        }

        container.appendChild(qBox);
      });

      // 시험 제출부 및 결과 컨트롤러 섹션 패널
      const ctrlPanel = document.createElement("div");
      ctrlPanel.className = "flex flex-col items-center justify-center py-6 border-t border-gray-100 gap-6";

      if (!quizSubmitted) {
        // 제출 버튼 활성화 조건 체크
        const answeredCount = Object.keys(selectedAnswers).length;
        const totalCount = content.questions.length;
        const isCompleted = answeredCount === totalCount;

        const submitBtn = document.createElement("button");
        submitBtn.className = `px-8 py-3.5 rounded-2xl font-bold transition shadow-md active:scale-95 text-base ${
          isCompleted 
            ? "bg-amber-500 text-white hover:bg-amber-600" 
            : "bg-gray-200 text-gray-400 cursor-not-allowed"
        }`;
        submitBtn.innerText = `채점 및 답안 제출하기 (${answeredCount} / ${totalCount})`;
        
        submitBtn.onclick = () => {
          const grade = document.getElementById("input-grade").value;
          const classNum = document.getElementById("input-class").value;
          const studentNum = document.getElementById("input-number").value;
          const name = document.getElementById("input-name").value;

          if (!grade || !classNum || !studentNum || !name) {
            const banner = document.getElementById("warning-banner");
            document.getElementById("warning-text").innerText = "형성 평가를 제출하려면 먼저 상단의 인적 사항(학년, 반, 번호, 이름)을 모두 기재해 주세요!";
            banner.classList.remove("hidden");
            window.scrollTo({ top: banner.offsetTop - 50, behavior: 'smooth' });
            return;
          }
          
          document.getElementById("warning-banner").classList.add("hidden");
          quizSubmitted = true;
          renderContent();
        };

        ctrlPanel.appendChild(submitBtn);
      } else {
        // 결과 성적표 배지 영역
        const scoreInfo = getScoreInfo(content.questions);
        const reportCard = document.createElement("div");
        reportCard.className = "bg-gradient-to-r from-amber-50 to-orange-50 p-6 rounded-3xl border border-amber-100 w-full max-w-lg mx-auto shadow-sm space-y-3 text-center";
        
        const gradeVal = document.getElementById("input-grade").value;
        const classVal = document.getElementById("input-class").value;
        const numVal = document.getElementById("input-number").value;
        const nameVal = document.getElementById("input-name").value;

        reportCard.innerHTML = `
          <i class="fa-solid fa-trophy text-amber-500 text-4xl mb-1"></i>
          <h4 class="font-extrabold text-xl text-amber-950">형성 평가 분석 성적표</h4>
          <div class="grid grid-cols-2 gap-2 bg-white/80 p-3 rounded-xl border border-amber-50 text-left text-xs text-gray-600">
            <div>ㆍ <span class="font-bold">평가 대상자:</span> ${gradeVal}학년 ${classVal}반 ${numVal}번 ${nameVal}</div>
            <div>ㆍ <span class="font-bold">학습 영역:</span> ${activeMainTab}</div>
            <div>ㆍ <span class="font-bold">맞춘 문항:</span> ${scoreInfo.correctCount} / ${scoreInfo.total} 문항</div>
            <div>ㆍ <span class="font-bold">성공 성취율:</span> ${scoreInfo.percent}%</div>
          </div>
          <div class="text-3xl font-black text-amber-600">${scoreInfo.percent} 점</div>
        `;
        ctrlPanel.appendChild(reportCard);

        // 구글 스프레드시트 수집 패널 렌더링
        const dataCollectBox = document.createElement("div");
        dataCollectBox.className = "bg-indigo-50/50 p-5 rounded-3xl border border-indigo-100/60 w-full max-w-lg mx-auto space-y-4 text-center";
        dataCollectBox.innerHTML = `
          <div class="flex items-center gap-2 justify-center text-indigo-900 font-bold text-sm">
            <i class="fa-solid fa-database text-indigo-600"></i>
            <span>구글 스프레드시트 결과 수집 및 기록</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="collect-buttons"></div>
          <div id="collect-status-text" class="p-3 hidden text-xs rounded-xl border font-semibold leading-relaxed"></div>
        `;
        
        ctrlPanel.appendChild(dataCollectBox);
        container.appendChild(ctrlPanel);

        // 연동 수집용 서브 버튼 생성기 호출
        renderCollectButtons(scoreInfo, content.questions);
      }

      container.appendChild(ctrlPanel);
    }

    // 결과 전송/수집 버튼 렌더링
    function renderCollectButtons(scoreInfo, questions) {
      const btnWrapper = document.getElementById("collect-buttons");
      
      // 1. 스프레드시트 엑셀용 TSV 복사 버튼
      const copyBtn = document.createElement("button");
      copyBtn.className = "flex flex-col items-center justify-center p-3.5 bg-white border border-indigo-200 rounded-2xl hover:bg-indigo-50 hover:border-indigo-400 transition group";
      copyBtn.innerHTML = `
        <i class="fa-solid fa-copy text-indigo-600 mb-1 group-hover:scale-110 transition text-lg"></i>
        <span class="text-xs font-bold text-gray-800">스프레드시트용 복사</span>
        <span class="text-[10px] text-gray-500 mt-1">Ctrl+V로 시트에 바로 붙여넣기</span>
      `;
      copyBtn.onclick = () => {
        executeTsvCopy(scoreInfo, questions);
      };

      // 2. Apps Script Webhook 연동 전송 설정 토글 버튼
      const sendBtn = document.createElement("button");
      sendBtn.className = "flex flex-col items-center justify-center p-3.5 bg-white border border-indigo-200 rounded-2xl hover:bg-indigo-50 hover:border-indigo-400 transition group";
      sendBtn.innerHTML = `
        <i class="fa-solid fa-paper-plane text-indigo-600 mb-1 group-hover:scale-110 transition text-lg"></i>
        <span class="text-xs font-bold text-gray-800">구글 자동 연동 설정</span>
        <span class="text-[10px] text-gray-500 mt-1">Apps Script Webhook 주소 입력</span>
      `;
      sendBtn.onclick = () => {

      };

      btnWrapper.appendChild(copyBtn);
      btnWrapper.appendChild(sendBtn);

      // 3. 다시 풀기 버튼을 담는 아래 정렬부 추가
      const restartBtn = document.createElement("button");
      restartBtn.className = "inline-flex items-center gap-2 px-6 py-2.5 bg-gray-600 text-white font-semibold rounded-xl text-sm hover:bg-gray-700 transition active:scale-95 shadow-sm mt-4";
      restartBtn.innerHTML = `<i class="fa-solid fa-rotate-left"></i> 다시 풀어보기`;
      restartBtn.onclick = handleQuizReset;
      
      btnWrapper.parentNode.appendChild(restartBtn);
    }

    // 복사 동작 로직 (문항별 완벽 분배 TSV 포맷팅)
    function executeTsvCopy(scoreInfo, questions) {
      const timestamp = new Date().toLocaleString("ko-KR");
      const grade = document.getElementById("input-grade").value;
      const classNum = document.getElementById("input-class").value;
      const studentNum = document.getElementById("input-number").value;
      const name = document.getElementById("input-name").value;

      // 엑셀, 스프레드시트 칼럼별 복사용 헤더 구성 (개별 문항의 응답과 정오 칼럼 생성)
      let headers = "제출시각\t평가영역\t학년\t반\t번호\t이름\t총점";
      for (let i = 1; i <= 10; i++) {
        headers += `\tQ${i}응답\tQ${i}정오`;
      }
      headers += "\n";

      // 개별 데이터 행 구성
      let rowData = `${timestamp}\t${activeMainTab}\t${grade}\t${classNum}\t${studentNum}\t${name}\t${scoreInfo.percent}점`;
      
      questions.forEach(q => {
        const selVal = selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] + 1 : "미응답";
        const isRight = selectedAnswers[q.id] === q.answer ? "O" : "X";
        rowData += `\t${selVal}\t${isRight}`;
      });
      
      const fullText = headers + rowData;

      // 임시 텍스트 에어리어를 통한 안전한 클립보드 복사 기법 구현
      const tempArea = document.createElement("textarea");
      tempArea.value = fullText;
      document.body.appendChild(tempArea);
      tempArea.select();
      
      const statusText = document.getElementById("collect-status-text");
      try {
        document.execCommand('copy');
        statusText.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-green-50 text-green-800 border-green-200 mt-3 block";
        statusText.innerText = "✓ 성공적으로 복사되었습니다! 구글 스프레드시트나 엑셀의 빈 칸에 커서를 두고 [Ctrl + V]를 눌러 붙여넣기 하세요.";
      } catch (err) {
        statusText.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-red-50 text-red-800 border-red-200 mt-3 block";
        statusText.innerText = "복사 동작이 차단되었습니다. 브라우저 설정을 확인하세요.";
      }
      document.body.removeChild(tempArea);
    }

    // Webhook API 주소 기입 토글 UI 렌더링
    function toggleWebhookSettings(scoreInfo, questions) {
      // 기존에 셋팅창이 있으면 토글 비활성화
      const existBox = document.getElementById("webhook-setting-box");
      if (existBox) {
        existBox.remove();
        return;
      }

      const box = document.createElement("div");
      box.id = "webhook-setting-box";
      box.className = "p-3 bg-white rounded-xl border border-indigo-100 text-left space-y-2 mt-4 fade-in";
      box.innerHTML = `
        <label class="block text-[11px] font-bold text-gray-500">Google Apps Script Web Webhook URL 주소</label>
        <div class="flex gap-2">
          <input
            type="text"
            id="webhook-url-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            value="${googleWebUrl}"
            class="flex-1 px-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500"
          />
          <button id="webhook-send-btn" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-indigo-700 transition">
            전송
          </button>
        </div>
        <span class="text-[9px] text-gray-400 block leading-normal">
          ※ 구글 Apps Script로 배포 완료하여 발급받은 웹 앱의 실행 URL을 여기에 붙여넣은 뒤 전송 버튼을 누르면 스프레드시트에 자동 업로드됩니다.
        </span>
      `;

      const statusBox = document.getElementById("collect-status-text");
      statusBox.parentNode.insertBefore(box, statusBox);

      // 입력 이벤트 연동
      document.getElementById("webhook-url-input").addEventListener("input", (e) => {
        googleWebUrl = e.target.value;
      });

      // API 전송 발동 버튼 바인딩
      document.getElementById("webhook-send-btn").onclick = () => {
        executeDirectSend(scoreInfo, questions);
      };
    }

    // Apps Script API Endpoint Webhook 호출 실행 로직
    async function executeDirectSend(scoreInfo, questions) {
      const statusText = document.getElementById("collect-status-text");
      
      if (!googleWebUrl) {
        statusText.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-red-50 text-red-800 border-red-200 mt-3 block";
        statusText.innerText = "경고: 먼저 입력창에 올바른 구글 Apps Script 웹 앱 배포 실행 주소를 입력해 주시기 바랍니다.";
        return;
      }

      statusText.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-indigo-50 text-indigo-800 border-indigo-200 mt-3 block";
      statusText.innerText = "구글 스프레드시트로 전송 데이터를 패키징하여 업로드 중입니다...";

      const grade = document.getElementById("input-grade").value;
      const classNum = document.getElementById("input-class").value;
      const studentNum = document.getElementById("input-number").value;
      const name = document.getElementById("input-name").value;

      // 각 개별 문항의 응답 번호와 정오답 여부 패키징
      const detailedAnswers = questions.map(q => {
        return {
          userAnswer: selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] + 1 : "미응답",
          isCorrect: selectedAnswers[q.id] === q.answer
        };
      });

      const payload = {
        timestamp: new Date().toISOString(),
        topic: activeMainTab,
        grade,
        classNum,
        studentNum,
        name,
        scorePercent: scoreInfo.percent,
        answers: detailedAnswers
      };

      try {
        await fetch(googleWebUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        statusText.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-green-50 text-green-800 border-green-200 mt-3 block";
        statusText.innerText = "✓ 구글 스프레드시트에 채점 결과 전송 요청이 성공적으로 완료되었습니다! 스프레드시트를 조회해 보세요.";
      } catch (err) {
        statusText.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-red-50 text-red-800 border-red-200 mt-3 block";
        statusText.innerText = "전송 중 예기치 않은 network 지연이나 에러가 발생했습니다. '스프레드시트용 복사' 기능을 활용해 주시기 바랍니다.";
      }
    }

    // 점수 정보 가져오기 헬퍼 함수
    function getScoreInfo(questions) {
      let correctCount = 0;
      questions.forEach(q => {
        if (selectedAnswers[q.id] === q.answer) {
          correctCount++;
        }
      });
      const total = questions.length;
      const percent = Math.round((correctCount / total) * 100);
      return { correctCount, total, percent };
    }

    // 퀴즈 초기화 기능
    function handleQuizReset() {
      resetQuizState();
      renderContent();
    }
  </script>
</body>
</html>
