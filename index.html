<!DOCTYPE html>

      from { opacity: 0; transform: translateY(8px); }

    }
    /* 문단 내어쓰기(Hanging Indent) 필수 클래스 */

    }
    .hanging-indent-content {
      flex: 1;
      text-align: left;
    }

      background-color: rgba(238, 242, 255, 0.7); /* bg-indigo-50/70 */

      border-radius: 4px;
      margin-right: 6px;

    // 전역 상태 변수 관리
    let activeMainTab = "시의 특징";
    let activeSubTab = "뜻";
    let grade = "";
    let classNum = "";
    let studentNum = "";
    let name = "";
    let googleWebUrl = localStorage.getItem("googleWebUrl") || "";
    let selectedAnswers = {};
    let quizSubmitted = false;
    let quizStarted = false;
    let activeSegmentIndex = 0;
    let sendStatus = ""; // "no-url", "sending", "success", "error"

    // 앱 구동 개시 및 최초 로드
    window.onload = function() {
      document.getElementById("global-webhook-url").value = googleWebUrl;
      renderMainTabs();
      renderSubTabs();
      renderContent();
    };

    // 대주제 탭 렌더러
    function renderMainTabs() {
      const container = document.getElementById("main-tabs-container");
      container.innerHTML = "";
      Object.keys(learningData).forEach(tabName => {
        const btn = document.createElement("button");
        const isActive = activeMainTab === tabName;
        btn.className = `flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl font-bold transition-all duration-300 ${
          isActive 
            ? "bg-indigo-600 text-white shadow-lg shadow-indigo-200 transform scale-[1.02]" 
            : "bg-gray-50 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600"
        }`;
        btn.onclick = () => switchMainTab(tabName);
        btn.innerHTML = `<i class="fa-solid ${learningData[tabName].icon}"></i> <span class="text-sm md:text-base">${tabName}</span>`;
        container.appendChild(btn);
      });
    }

    // 세부 영역 탭 렌더러
    function renderSubTabs() {
      const container = document.getElementById("sub-tabs-container");
      container.innerHTML = "";
      const currentMain = learningData[activeMainTab];
      Object.keys(currentMain.subTabs).forEach(subName => {
        const btn = document.createElement("button");
        const isQuizTab = subName === "형성 평가";
        const isActive = activeSubTab === subName;
        
        let btnClass = "px-5 py-2.5 rounded-full text-xs md:text-sm font-semibold transition-all duration-200 border ";
        if (isActive) {
          btnClass += isQuizTab 
            ? "bg-amber-100 text-amber-800 border-amber-300 shadow-sm" 
            : "bg-indigo-100 text-indigo-800 border-indigo-300 shadow-sm";
        } else {
          btnClass += isQuizTab 
            ? "bg-amber-50/50 text-amber-700 border-amber-100 hover:bg-amber-100/40" 
            : "bg-white text-gray-500 border-gray-200 hover:bg-gray-100";
        }
        
        btn.className = btnClass;
        btn.onclick = () => switchSubTab(subName);
        btn.innerText = subName;
        container.appendChild(btn);
      });
    }

    // 탭 변환 및 내부 리로드 바인딩
    function switchMainTab(tabName) {
      activeMainTab = tabName;
      const defaultSub = Object.keys(learningData[tabName].subTabs)[0];
      activeSubTab = defaultSub;
      resetQuizStates();
      quizStarted = false; // 대주제 변경 시 인적사항 가드 장치 재가동
      renderMainTabs();
      renderSubTabs();
      renderContent();
    }

    function switchSubTab(subName) {
      activeSubTab = subName;
      resetQuizStates();
      quizStarted = false; // 서브 탭 이동 시에도 문항 초기화와 함께 안전가동
      renderSubTabs();
      renderContent();
    }

    function resetQuizStates() {
      selectedAnswers = {};
      quizSubmitted = false;
      sendStatus = "";
      activeSegmentIndex = 0;
      hideWarning();
    }

    // 메인 콘텐츠 실시간 드로잉
    function renderContent() {
      const mainData = learningData[activeMainTab];
      const contentData = mainData.subTabs[activeSubTab] || mainData.subTabs[Object.keys(mainData.subTabs)[0]];
      
      // 헤더 패스 & 아이콘 업데이트
      document.getElementById("content-category-path").innerText = `${activeMainTab} ㆍ ${activeSubTab}`;
      document.getElementById("content-title").innerText = contentData.title;
      document.getElementById("content-brief").innerText = contentData.content;
      
      const iconContainer = document.getElementById("content-icon-container");
      const isQuiz = contentData.isQuiz;
      if (isQuiz) {
        iconContainer.className = "p-3 rounded-xl bg-amber-100 text-amber-600";
        document.getElementById("content-icon").className = "fa-solid fa-clipboard-question text-xl";
      } else {
        iconContainer.className = "p-3 rounded-xl bg-indigo-50 text-indigo-600";
        document.getElementById("content-icon").className = "fa-solid fa-book-open text-xl";
      }

      const detailsArea = document.getElementById("content-details-area");
      detailsArea.innerHTML = "";

      // 분기점 1: 형성 평가 (퀴즈) 일 때
      if (isQuiz) {
        if (!quizStarted) {
          renderStudentInputGate(detailsArea);
        } else {
          renderQuizForm(detailsArea, contentData);
        }
      } 
      // 분기점 2: 시 구절 스마트 전문 해설 일 때
      else if (contentData.isInteractivePoem) {
        renderInteractivePoem(detailsArea, contentData);
      } 
      // 분기점 3: 시의 종류 (Classified) 일 때
      else if (contentData.isClassified) {
        renderClassifiedList(detailsArea, contentData);
      }
      // 분기점 4: 일반 요약 자료 리스트 일 때
      else {
        renderDetailsList(detailsArea, contentData);
      }
    }

    // 시의 종류 대칭 정렬 렌더러
    function renderClassifiedList(container, contentData) {
      const mainWrapper = document.createElement("div");
      mainWrapper.className = "space-y-8 text-left animate-fade-in";

      const contentSection = document.createElement("div");
      contentSection.className = "flex flex-col gap-3";
      contentSection.innerHTML = `
        <div class="flex items-center gap-2 text-lg font-bold text-indigo-950">
          <i class="fa-solid fa-folder text-indigo-600 w-5 text-center"></i>
          <span>내용상 분류</span>
        </div>
      `;

      // 아이콘 너비(w-5=20px) + gap-2(8px) = 28px 오프셋 반영 -> pl-7 (28px) 설정으로 '내'자 시작점과 완벽 일치
      const contentCardsDiv = document.createElement("div");

      contentData.details.content.forEach(detail => {

        const card = createClassifiedCard(detail);

    // 시의 종류 분류 카드 생성 헬퍼 함수
    function createClassifiedCard(detail) {
      const card = document.createElement("div");
      card.className = "p-5 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md transition-all duration-200 text-left w-full";

      const cleanDetail = detail.replace(/^[📌💡✨🔍👉◆]\s*/, "");
      const colonIndex = cleanDetail.indexOf(':');
      let textSegmentHtml = "";

      if (colonIndex !== -1) {
        const term = cleanDetail.substring(0, colonIndex + 1);
        const desc = cleanDetail.substring(colonIndex + 1);
        textSegmentHtml = `
          <span class="hanging-indent-term">${term}</span>
          <span class="text-gray-700 font-medium">${desc}</span>
        `;
      } else {
        textSegmentHtml = `
          <span class="text-indigo-950 font-bold">${cleanDetail}</span>
        `;
      }

      card.innerHTML = `
        <div class="hanging-indent-container">
          <span class="text-indigo-500 flex-shrink-0 mt-1">
            <i class="fa-solid fa-circle text-[8px]"></i>
          </span>
          <div class="hanging-indent-content text-sm md:text-base leading-relaxed">
            ${textSegmentHtml}
          </div>
        </div>
      `;
      return card;
    }

    // 일반 개념 및 텍스트 리스트 렌더러
    function renderDetailsList(container, contentData) {
      contentData.details.forEach(detail => {
        // 내어쓰기 및 특수 서식 조립 진행
        const isNarrow = contentData.isComparison && (detail.startsWith("🔍") || detail.startsWith("👉"));
        
        const card = document.createElement("div");
        card.className = `animate-fade-in p-5 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md transition-all duration-200 ${
          isNarrow ? "max-w-[85%] ml-auto mr-0 border-indigo-100 bg-indigo-50/10" : ""
        }`;

        // ☞ 등 줄바꿈 기호 세련 처리
        if (detail.includes("☞") || detail.includes("\n")) {
          const lines = detail.split(/\n|☞/);
          const firstLine = lines[0].trim();
          const secondLine = lines[1] ? "☞ " + lines[1].trim() : "";

          card.innerHTML = `
            <div class="space-y-1.5">
              <p class="text-sm md:text-base text-indigo-950 font-bold leading-relaxed">${firstLine}</p>
              ${secondLine ? `<p class="text-sm md:text-base text-indigo-600 font-semibold leading-loose pl-4 pt-1.5 mt-2.5 border-t border-indigo-50/50">${secondLine}</p>` : ""}
            </div>
          `;
          container.appendChild(card);
          return;
        }

        const cleanDetail = detail.replace(/^[📌💡✨🔍👉◆]\s*/, "");
        const isHighlight = detail.startsWith("📌") || detail.startsWith("💡") || detail.startsWith("✨") || detail.startsWith("🔍");

        let iconHtml = `<span class="text-orange-400 flex-shrink-0 mt-0.5">◆</span>`;
        if (detail.startsWith("💡")) iconHtml = `<span class="flex-shrink-0 bg-yellow-50 text-yellow-600 px-1.5 py-0.5 rounded text-xs animate-pulse">💡</span>`;
        else if (detail.startsWith("📌")) iconHtml = `<span class="flex-shrink-0 bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded text-xs font-bold">📌</span>`;
        else if (detail.startsWith("✨")) iconHtml = `<span class="flex-shrink-0 bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded text-xs">✨</span>`;
        else if (detail.startsWith("🔍")) iconHtml = `<span class="flex-shrink-0 bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded text-xs">🔍</span>`;
        else if (detail.startsWith("👉")) iconHtml = `<span class="flex-shrink-0 text-slate-400 text-xs">👉</span>`;

        const colonIndex = cleanDetail.indexOf(':');
        let textSegmentHtml = "";

        if (colonIndex !== -1) {
          const term = cleanDetail.substring(0, colonIndex + 1);
          const desc = cleanDetail.substring(colonIndex + 1);
          textSegmentHtml = `
            <span class="hanging-indent-term">${term}</span>
            <span class="text-gray-700 font-medium">${desc}</span>
          `;
        } else {
          textSegmentHtml = `
            <span class="text-indigo-950 font-bold ${isHighlight ? 'bg-indigo-50/50 px-1 py-0.5 rounded' : ''}">
              ${cleanDetail}
            </span>
          `;
        }

        card.innerHTML = `
          <div class="hanging-indent-container">
            ${iconHtml}
            <div class="hanging-indent-content text-sm md:text-base leading-relaxed">
              ${textSegmentHtml}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 게이트 입력 검증 및 해제
    function startQuizAttempt() {
      grade = document.getElementById("gate-grade").value;
      classNum = document.getElementById("gate-class").value;
      studentNum = document.getElementById("gate-num").value;
      name = document.getElementById("gate-name").value.trim();

      if (!grade || !classNum || !studentNum || !name) {
        showWarning("모든 인적 사항(학년, 반, 번호, 이름)을 기입해야 형성평가 응시를 하실 수 있습니다.");
        return;
      }
      hideWarning();
      quizStarted = true;
      renderContent();
    }

    // 퀴즈 시험지 본문 렌더러
    function renderQuizForm(container, contentData) {
      const formWrapper = document.createElement("div");
      formWrapper.className = "space-y-6 animate-fade-in";

      contentData.questions.forEach((q, idx) => {
        const qCard = document.createElement("div");
        qCard.className = "p-5 md:p-6 bg-gray-50 rounded-2xl border border-gray-100 space-y-4 text-left";

        qCard.innerHTML = `
          <div class="flex gap-2">
            <span class="font-bold text-lg text-indigo-600 flex-shrink-0">Q${idx + 1}.</span>
            <h3 class="font-bold text-gray-800 text-base md:text-lg leading-relaxed">${q.question}</h3>
          </div>
        `;

        const optionsDiv = document.createElement("div");
        optionsDiv.className = "grid grid-cols-1 gap-2 pl-2";

        q.options.forEach((option, oIdx) => {
          const optBtn = document.createElement("button");
          optBtn.disabled = quizSubmitted;
          
          const isSelected = selectedAnswers[q.id] === oIdx;
          const isCorrectAnswer = q.answer === oIdx;

          let btnClass = "flex items-center text-left w-full px-4 py-3 border rounded-xl text-sm transition-all ";
          if (quizSubmitted) {
            if (isSelected) {
              btnClass += isCorrectAnswer 
                ? "bg-green-100 border-green-400 text-green-800 font-semibold" 
                : "bg-red-100 border-red-300 text-red-800";
            } else if (isCorrectAnswer) {
              btnClass += "bg-green-50 border-green-200 text-green-700 font-semibold";
            } else {
              btnClass += "bg-white border-gray-200 text-gray-400";
            }
          } else if (isSelected) {
            btnClass += "bg-indigo-50 border-indigo-400 text-indigo-800 font-semibold shadow-sm";
          } else {
            btnClass += "bg-white hover:bg-gray-100 border-gray-200 text-gray-700";
          }

          optBtn.className = btnClass;
          optBtn.innerHTML = `
            <span class="w-6 h-6 mr-3 flex-shrink-0 flex items-center justify-center rounded-full border text-xs bg-gray-50 text-gray-500 font-bold">${oIdx + 1}</span>
            <span>${option}</span>
          `;

          optBtn.onclick = () => {
            selectedAnswers[q.id] = oIdx;
            renderContent(); // 상태 재렌더링
          };

          optionsDiv.appendChild(optBtn);
        });

        qCard.appendChild(optionsDiv);

        // 해설란 출력 (제출 완료 시 등장)
        if (quizSubmitted) {
          const isUserCorrect = selectedAnswers[q.id] === q.answer;
          const explanationBox = document.createElement("div");
          explanationBox.className = `p-4 rounded-xl text-sm leading-relaxed text-left ${isUserCorrect ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`;
          explanationBox.innerHTML = `
            <div class="font-bold flex items-center gap-1.5 mb-1">
              ${isUserCorrect ? '<i class="fa-solid fa-circle-check text-green-600"></i> 정답' : '<i class="fa-solid fa-circle-xmark text-red-600"></i> 오답'}
              <span class="text-slate-500 font-normal"> (정답: ${q.answer + 1}번)</span>
            </div>
            <p class="mt-1 text-slate-600 font-medium"><strong class="text-slate-800">[해설]</strong> ${q.explanation}</p>
          `;
          qCard.appendChild(explanationBox);
        }

        formWrapper.appendChild(qCard);
      });

      // 시험지 결과 확인 바닥 제어판 영역
      const bottomDiv = document.createElement("div");
      bottomDiv.className = "flex flex-col items-center justify-center py-6 border-t border-gray-100 gap-6 w-full";

      const answeredCount = Object.keys(selectedAnswers).length;
      const totalCount = contentData.questions.length;

      if (!quizSubmitted) {
        const submitBtn = document.createElement("button");
        submitBtn.onclick = () => submitAllAnswers(contentData);
        submitBtn.className = `px-8 py-3.5 rounded-2xl font-bold transition shadow-md active:scale-95 text-base ${
          answeredCount === totalCount 
            ? "bg-indigo-600 text-white hover:bg-indigo-700 cursor-pointer" 
            : "bg-gray-200 text-gray-400 cursor-not-allowed"
        }`;
        submitBtn.disabled = answeredCount < totalCount;
        submitBtn.innerText = `채점 및 답안 제출하기 (${answeredCount} / ${totalCount})`;
        bottomDiv.appendChild(submitBtn);
      } else {
        renderQuizScoreCard(bottomDiv, contentData);
      }

      formWrapper.appendChild(bottomDiv);
      container.appendChild(formWrapper);
    }

    // 퀴즈 제출 및 채점 연산
    function submitAllAnswers(contentData) {
      if (!grade || !classNum || !studentNum || !name) {
        showWarning("학적 기입 정보에 누락이 발생했습니다. 인적 사항 정보를 재점검해 주세요.");
        return;
      }
      hideWarning();
      quizSubmitted = true;
      
      // 점수 분석 수집 엔진 가동
      const scoreInfo = calculateScores(contentData);
      executeBackgroundPost(scoreInfo, contentData);
      renderContent();
    }

    function calculateScores(contentData) {
      let correctCount = 0;
      contentData.questions.forEach(q => {
        if (selectedAnswers[q.id] === q.answer) {
          correctCount++;
        }
      });
      const total = contentData.questions.length;
      const scorePercent = Math.round((correctCount / total) * 100);
      return { correctCount, total, scorePercent };
    }

    // 구글 스프레드시트 비동기 POST 수동/자동 전송 시스템
    function executeBackgroundPost(scoreInfo, contentData) {
      if (!googleWebUrl) {
        sendStatus = "no-url";
        renderContent();
        return;
      }

      sendStatus = "sending";
      renderContent();

      const detailedAnswers = contentData.questions.map(q => {
        return {
          userAnswer: selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] + 1 : "미응답",
          isCorrect: selectedAnswers[q.id] === q.answer
        };
      });

      const payload = {
        timestamp: new Date().toISOString(),
        topic: activeMainTab,
        grade,
        classNum,
        studentNum,
        name,
        scorePercent: scoreInfo.scorePercent,
        answers: detailedAnswers
      };

      fetch(googleWebUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        sendStatus = "success";
        renderContent();
      })
      .catch(() => {
        sendStatus = "error";
        renderContent();
      });
    }

    // 채점 데이터 요약 성적표 및 백엔드 전송 패널 렌더러
    function renderQuizScoreCard(container, contentData) {
      const scoreInfo = calculateScores(contentData);
      
      const wrapper = document.createElement("div");
      wrapper.className = "text-center space-y-6 w-full animate-fade-in";

      // 성적 분석표 드로잉
      const card = document.createElement("div");
      card.className = "bg-gradient-to-r from-indigo-50 to-indigo-100/50 p-6 rounded-3xl border border-indigo-100/60 w-full max-w-lg mx-auto shadow-sm space-y-3 text-center";
      card.innerHTML = `
        <i class="fa-solid fa-trophy text-amber-500 text-5xl"></i>
        <h4 class="font-extrabold text-xl text-indigo-950">형성 평가 분석 성적표</h4>
        <div class="grid grid-cols-2 gap-2 bg-white/80 p-3 rounded-xl border border-indigo-50 text-left text-xs text-gray-600">
          <div>ㆍ <span class="font-bold">평가 대상자:</span> ${grade}학년 ${classNum}반 ${studentNum}번 ${name}</div>
          <div>ㆍ <span class="font-bold">학습 영역:</span> ${activeMainTab}</div>
          <div>ㆍ <span class="font-bold">맞춘 문항:</span> ${scoreInfo.correctCount} / ${scoreInfo.total} 문항</div>
          <div>ㆍ <span class="font-bold">성공 성취율:</span> ${scoreInfo.scorePercent}%</div>
        </div>
        <div class="text-3xl font-black text-indigo-600">${scoreInfo.scorePercent} 점</div>
      `;
      wrapper.appendChild(card);

      // 수집 전송 상태판 대시보드
      const dbPanel = document.createElement("div");
      dbPanel.className = "bg-indigo-50/50 p-5 rounded-3xl border border-indigo-100/60 w-full max-w-lg mx-auto space-y-4 text-center mt-4";
      
      let stateHtml = "";
      if (sendStatus === "no-url") {
        stateHtml = `
          <div class="p-3.5 text-xs rounded-xl border font-semibold leading-relaxed bg-amber-50 text-amber-800 border-amber-200 text-left">
            <div class="flex items-start gap-2">
              <i class="fa-solid fa-triangle-exclamation text-amber-600 mt-0.5 flex-shrink-0 text-base"></i>
              <div>
                <p class="font-bold">스프레드시트 연동 대기</p>
                <p class="text-[10px] text-gray-500 mt-0.5 leading-normal">
                  현재 브라우저에 구글 Webhook 주소가 세팅되어 있지 않습니다. 하단의 [교사용 자동 수집 설정]에 주소를 입력 및 저장한 뒤 응시하면 완전한 자동 수집이 개시됩니다. 지금 결과는 아래의 [예비용 복사] 버튼으로 전송할 수 있습니다.
                </p>
              </div>
            </div>
          </div>
        `;
      } else if (sendStatus === "sending") {
        stateHtml = `
          <div class="p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-indigo-50 text-indigo-800 border-indigo-200 text-left">
            <i class="fa-solid fa-spinner animate-spin text-indigo-600 inline mr-1.5"></i> 
            채점 데이터를 구글 스프레드시트 <strong>'${activeMainTab}'</strong> 시트로 자동 업로드하는 중...
          </div>
        `;
      } else if (sendStatus === "success") {
        stateHtml = `
          <div class="p-3.5 text-xs rounded-xl border font-semibold leading-relaxed bg-green-50 text-green-800 border-green-200 text-left">
            <div class="flex items-start gap-2">
              <i class="fa-solid fa-circle-check text-green-600 mt-0.5 flex-shrink-0 text-base"></i>
              <div>
                <p class="font-bold">자동 전송 완료!</p>
                <p class="text-[10px] text-gray-500 mt-0.5 leading-normal">
                  선생님의 구글 스프레드시트 <strong>'${activeMainTab}'</strong> 탭에 학생의 성적 정보, 문항별 응답 및 정오 데이터가 오차 없이 실시간 등록되었습니다.
                </p>
              </div>
            </div>
          </div>
        `;
      } else if (sendStatus === "error") {
        stateHtml = `
          <div class="p-3.5 text-xs rounded-xl border font-semibold leading-relaxed bg-red-50 text-red-800 border-red-200 text-left">
            <div class="flex items-start gap-2">
              <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5 flex-shrink-0 text-base"></i>
              <div>
                <p class="font-bold">자동 전송 네트워크 지연/오류</p>
                <p class="text-[10px] text-gray-500 mt-0.5 leading-normal">
                  교내 통신망 방화벽 차단 등으로 자동 송신이 완료되지 못했습니다. 아래의 <strong>[예비용 스프레드시트 복사]</strong> 버튼을 이용해 데이터 백업을 수행해 주시기 바랍니다.
                </p>
              </div>
            </div>
          </div>
        `;
      }

      dbPanel.innerHTML = `
        <div class="flex items-center gap-2 justify-center text-indigo-900 font-bold text-sm">
          <i class="fa-solid fa-database text-indigo-600"></i>
          <span>구글 스프레드시트 자동 전송 상태 대시보드</span>
        </div>
        ${stateHtml}
        <div class="grid grid-cols-1 gap-2 pt-1">
          <button onclick="copyScoresToClipboard()" class="flex items-center justify-center gap-2 p-3 bg-white border border-indigo-200 hover:border-indigo-400 hover:bg-indigo-50/40 rounded-xl transition font-bold text-xs text-gray-700 active:scale-95 w-full">
            <i class="fa-solid fa-clipboard text-indigo-600"></i>
            <span>예비용 스프레드시트 복사 (네트워크 실패 대비 수동 저장)</span>
          </button>
          <div id="copy-success-message" class="hidden p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-green-50 text-green-800 border-green-200 mt-2 text-left w-full animate-fade-in"></div>
        </div>
      `;
      wrapper.appendChild(dbPanel);

      // 재시험 버튼
      const retestBtn = document.createElement("button");
      retestBtn.onclick = resetRetestQuiz;
      retestBtn.className = "inline-flex items-center gap-2 px-6 py-2.5 bg-gray-600 text-white font-semibold rounded-xl text-sm hover:bg-gray-700 transition active:scale-95 shadow-sm mt-4 mx-auto";
      retestBtn.innerHTML = `<i class="fa-solid fa-rotate-left"></i> 다시 풀어보기`;
      wrapper.appendChild(retestBtn);

      container.appendChild(wrapper);
    }

    // 수동 백업용 복사 기법 (TSV 탭 분할 텍스트 컴파일)
    function copyScoresToClipboard() {
      const mainData = learningData[activeMainTab];
      const contentData = mainData.subTabs[activeSubTab];
      const scoreInfo = calculateScores(contentData);
      const timestamp = new Date().toLocaleString("ko-KR");
      
      // 칼럼 규격 매핑
      let headers = "제출시각\t평가영역\t학년\t반\t번호\t이름\t총점";
      for (let i = 1; i <= 10; i++) {
        headers += `\tQ${i}응답\tQ${i}정오`;
      }
      headers += "\n";

      let rowData = `${timestamp}\t${activeMainTab}\t${grade}\t${classNum}\t${studentNum}\t${name}\t${scoreInfo.scorePercent}점`;
      
      contentData.questions.forEach(q => {
        const selVal = selectedAnswers[q.id] !== undefined ? selectedAnswers[q.id] + 1 : "미응답";
        const isRight = selectedAnswers[q.id] === q.answer ? "O" : "X";
        rowData += `\t${selVal}\t${isRight}`;
      });
      
      const fullText = headers + rowData;

      // 아이프레임 우회 복사기
      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = fullText;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      try {
        document.execCommand('copy');
        const box = document.getElementById("copy-success-message");
        box.className = "p-3 text-xs rounded-xl border font-semibold leading-relaxed bg-green-50 text-green-800 border-green-200 mt-2 block text-left w-full animate-fade-in";
        box.innerText = `✓ 복사가 성공적으로 완료되었습니다! 구글 스프레드시트의 '${activeMainTab}' 시트 탭을 연 뒤, 첫 번째 칸(A열)을 선택하고 [Ctrl + V]를 눌러 붙여넣기 하세요.`;
        setTimeout(() => {
          box.className = "hidden";
        }, 9000);
      } catch (err) {
        alert("복사 중 에러가 발생했습니다. 브라우저 설정을 확인해 주세요.");
      }
      document.body.removeChild(tempTextArea);
    }

    function resetRetestQuiz() {
      selectedAnswers = {};
      quizSubmitted = false;
      sendStatus = "";
      quizStarted = true; // 재응시 시에는 인적 사항 게이트를 바로 패스함
      renderContent();
    }

    // 경고 메시지 배너 제어
    function showWarning(text) {
      const banner = document.getElementById("warning-banner");
      document.getElementById("warning-text").innerText = text;
      banner.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 경고 배너 가림
    function hideWarning() {
      document.getElementById("warning-banner").classList.add("hidden");
    }

    // 교사용 설정창 접고 펴기
    function toggleTeacherConfigPanel() {
      const panel = document.getElementById("teacher-config-panel");
      const icon = document.getElementById("config-toggle-icon");
      if (panel.classList.contains("hidden")) {
        panel.classList.remove("hidden");
        icon.className = "fa-solid fa-chevron-down text-xs transition duration-200 rotate-180";
      } else {
        panel.classList.add("hidden");
        icon.className = "fa-solid fa-chevron-down text-xs transition duration-200";
      }
    }

    // 구글 연동 주소 저장
    function saveGlobalWebhookUrl() {
      const url = document.getElementById("global-webhook-url").value.trim();
      googleWebUrl = url;
      localStorage.setItem("googleWebUrl", url);
      
      const status = document.getElementById("config-save-status");
      status.classList.remove("hidden");
      setTimeout(() => {
        status.classList.add("hidden");
      }, 3000);
    }
  </script>
</body>
