<!DOCTYPE html>

      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* 문단 내어쓰기(Hanging Indent) 필수 클래스 */

      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .hanging-indent-content {
      flex: 1;
      text-align: left;
    }
    .hanging-indent-term {
      font-weight: 800;
      color: #1e1b4b; /* text-indigo-950 */
      background-color: rgba(238, 242, 255, 0.7); /* bg-indigo-50/70 */
      padding: 2px 6px;
      border-radius: 4px;

<body class="bg-gradient-to-br from-indigo-50 via-gray-50 to-indigo-50/30 text-gray-800 min-h-screen p-4 md:p-8 pb-20">
